<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pojdes so mnou na date?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Patrick+Hand&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page-invite">
    <div class="bg-layer" aria-hidden="true">
      <canvas id="hearts-canvas"></canvas>
      <div class="film-grain"></div>
    </div>

    <main class="app">
      <!-- Step 1: open doodle layout, no card box -->
      <section class="step step-active step-invite" id="step-ask" data-step="1">
        <div class="invite-inner" id="invite-inner">
          <h1 class="invite-title dodge-blocker">
            Pojdes so mnou<br />
            <span>na date?</span>
          </h1>

          <div class="sketch-frame dodge-blocker" id="sketch-frame">
            <div class="sketch-pin" aria-hidden="true"></div>
            <div class="screen-glow" aria-hidden="true"></div>
            <svg class="sketch-art" viewBox="0 0 280 210" aria-hidden="true">
              <g class="sketch-scene">
                <g class="anim-curtain-l">
                  <path
                    fill="currentColor"
                    opacity="0.12"
                    d="M24 36c0-6 5-11 11-11h14v98H35c-6 0-11-5-11-11V36z"
                  />
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    d="M32 32c6-4 14-4 20 0v92M36 32v92"
                  />
                </g>
                <g class="anim-curtain-r">
                  <path
                    fill="currentColor"
                    opacity="0.12"
                    d="M256 36c0-6-5-11-11-11h-14v98h14c6 0 11-5 11-11V36z"
                  />
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    d="M248 32c-6-4-14-4-20 0v92M244 32v92"
                  />
                </g>
                <g class="anim-screen">
                  <rect
                    x="68"
                    y="44"
                    width="144"
                    height="82"
                    rx="2"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.2"
                  />
                  <rect
                    class="screen-fill"
                    x="74"
                    y="50"
                    width="132"
                    height="70"
                    fill="currentColor"
                    opacity="0.06"
                  />
                  <rect
                    class="screen-shimmer"
                    x="74"
                    y="50"
                    width="132"
                    height="70"
                    fill="url(#shimmer)"
                    opacity="0.35"
                  />
                </g>
                <g transform="translate(140, 85)">
                  <g class="anim-play">
                    <circle cx="0" cy="0" r="18" fill="none" stroke="currentColor" stroke-width="1.8" />
                    <path fill="currentColor" d="M-6 -9l20 9-20 9V-9z" />
                  </g>
                </g>
                <circle class="anim-sparkle" cx="95" cy="62" r="1.5" fill="currentColor" />
                <circle class="anim-sparkle" cx="185" cy="58" r="1.2" fill="currentColor" style="animation-delay: 0.6s" />
                <circle class="anim-sparkle" cx="165" cy="108" r="1" fill="currentColor" style="animation-delay: 1.1s" />
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  opacity="0.5"
                  d="M52 128h176"
                />
              </g>
              <defs>
                <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="currentColor" stop-opacity="0" />
                  <stop offset="45%" stop-color="currentColor" stop-opacity="0.2" />
                  <stop offset="55%" stop-color="currentColor" stop-opacity="0.2" />
                  <stop offset="100%" stop-color="currentColor" stop-opacity="0" />
                </linearGradient>
              </defs>

              <g class="sketch-extras">
                <g transform="translate(42, 148)">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linejoin="round"
                    d="M8 28h32l-5 18H13L8 28z"
                  />
                  <circle cx="14" cy="22" r="4" fill="currentColor" />
                  <circle cx="24" cy="18" r="4.5" fill="currentColor" />
                  <circle cx="34" cy="22" r="4" fill="currentColor" />
                  <circle cx="20" cy="12" r="3.5" fill="currentColor" />
                  <circle cx="30" cy="10" r="3" fill="currentColor" />
                </g>
                <g transform="translate(122, 152)">
                  <circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="2" />
                  <circle cx="18" cy="18" r="5" fill="currentColor" />
                  <circle cx="18" cy="8" r="2" fill="currentColor" />
                  <circle cx="18" cy="28" r="2" fill="currentColor" />
                  <circle cx="8" cy="18" r="2" fill="currentColor" />
                  <circle cx="28" cy="18" r="2" fill="currentColor" />
                </g>
                <g class="anim-tickets" transform="translate(196, 148)">
                  <rect
                    x="0"
                    y="6"
                    width="46"
                    height="26"
                    rx="2"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  />
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-dasharray="3 2"
                    d="M23 6v26"
                  />
                  <text
                    x="7"
                    y="23"
                    font-family="Arial, sans-serif"
                    font-size="8"
                    font-weight="bold"
                    fill="currentColor"
                    letter-spacing="0.8"
                  >
                    FILM
                  </text>
                  <rect
                    x="12"
                    y="0"
                    width="46"
                    height="26"
                    rx="2"
                    fill="var(--cream)"
                    stroke="currentColor"
                    stroke-width="2"
                    transform="rotate(10 35 13)"
                  />
                </g>
              </g>
            </svg>
          </div>

          <div class="invite-pick" id="yes-anchor">
            <button type="button" class="doodle-choice dodge-blocker" id="btn-yes">
              <span class="doodle-box" id="yes-box"></span>
              <span class="doodle-label">ano</span>
            </button>
          </div>
        </div>

        <button
          type="button"
          class="doodle-choice doodle-choice--dodge"
          id="btn-no"
          tabindex="-1"
        >
          <span class="doodle-box"></span>
          <span class="doodle-label">nie</span>
        </button>
      </section>

      <!-- Step 2 -->
      <section class="step" id="step-details" data-step="2">
        <div class="doodle-card">
          <div class="choice-tabs">
            <button type="button" class="tab tab-active" data-choice="pickup">
              Kedy pridem po teba?
            </button>
            <button type="button" class="tab" data-choice="movie">Ktory cas filmu?</button>
          </div>

          <div class="choice-panel choice-panel-active" id="panel-pickup">
            <label class="field-label" for="pickup-time">Vyber si cas</label>
            <input type="time" id="pickup-time" class="time-input" required />
          </div>

          <div class="choice-panel" id="panel-movie">
            <p class="field-label">Vyber si cas filmu</p>
            <div class="movie-options">
              <label class="movie-option">
                <input type="radio" name="movie-time" value="17:30" />
                <span class="movie-pill">17:30</span>
              </label>
              <label class="movie-option">
                <input type="radio" name="movie-time" value="20:00" />
                <span class="movie-pill">20:00</span>
              </label>
            </div>
          </div>

          <button type="button" class="doodle-btn-submit" id="btn-submit">Moze byt</button>
          <p class="hint" id="form-hint" hidden>Vyber prosim cas pred odoslanim</p>
        </div>
      </section>

      <!-- Step 3 -->
      <section class="step" id="step-done" data-step="3">
        <div class="doodle-card doodle-card--final">
          <p class="final-scribble" aria-hidden="true">♥</p>
          <h2 class="final-title">Tesim sa :P</h2>
          <p class="final-sub" id="final-summary"></p>
        </div>
      </section>
    </main>

    <div class="celebration" id="celebration" aria-hidden="true"></div>
    <div class="cursor-sparkles" id="cursor-sparkles" aria-hidden="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
